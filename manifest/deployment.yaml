apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-web
  template:
    metadata:
      labels:
        app: python-web
    spec:
      containers:
        - name: python-web
          image: localhost:32000/python_web:latest
          ports:
            - containerPort: 8080
          volumeMounts: [ ]
      volumes: [ ]
